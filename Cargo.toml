[package]
name = "watcher"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
aws-config = "1.10.1"
aws-sdk-eventbridge = "1.112.0"
aws-sdk-sqs = "1.105.0"
aws-sdk-ssm = "1.118.0"
clap = { version = "4.6.6", features = ["derive", "env"] }
hex = "0.4.3"
humantime-serde = "1.1.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "process", "time", "sync", "fs"] }
tokio-util = "0.7.19"
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[dev-dependencies]
tempfile = "3.27.0"
